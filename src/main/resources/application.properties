# ==========================================
# innovaFeed - configuración por defecto (DESARROLLO con H2)
# Para producción: --spring.profiles.active=prod
# ==========================================
spring.application.name=innovafeed
server.port=8080

# --- Base de datos H2 en ARCHIVO (carpeta ./data, los datos sobreviven a los reinicios) ---
# Para volver a los datos de prueba iniciales: apagar la app y borrar la carpeta "data".
spring.datasource.url=jdbc:h2:file:./data/innovafeed
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# update: crea las tablas que falten a partir de las entidades, sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Permite cargar relaciones perezosas desde las vistas Thymeleaf (simple para un PMV)
spring.jpa.open-in-view=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Mensajes y codificación ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- Reglas de negocio configurables ---
innovafeed.suscripcion.dias=30
innovafeed.boost.horas=48

# Contraseña del admin de demostración (en producción se toma de ADMIN_PASSWORD)
innovafeed.admin.password=Admin123*
