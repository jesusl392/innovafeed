# ==========================================
# innovaFeed - configuración por defecto (DESARROLLO con H2)
# Para producción: --spring.profiles.active=prod
# ==========================================
spring.application.name=innovafeed
server.port=8080

# --- Base de datos H2 en memoria (se borra al apagar la app) ---
spring.datasource.url=jdbc:h2:mem:innovafeed;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# create-drop: crea las tablas al iniciar a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Permite cargar relaciones perezosas desde las vistas Thymeleaf (simple para un PMV)
spring.jpa.open-in-view=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Mensajes y codificación ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- Reglas de negocio configurables ---
innovafeed.suscripcion.dias=30
innovafeed.boost.horas=48
