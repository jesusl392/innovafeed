# ==========================================
# innovaFeed - PRODUCCIÓN (PostgreSQL, p. ej. Supabase)
# Activar con: java -jar innovafeed.jar --spring.profiles.active=prod
# (el Dockerfile ya lo activa). Los datos sensibles se leen de variables
# de entorno, nunca se escriben aquí.
# ==========================================

# --- Base de datos ---
# Supabase: usar el "Session pooler" (puerto 5432), NO el "Transaction pooler" (6543),
# porque Hibernate usa sentencias preparadas. Ejemplo de DB_URL:
#   jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/innovafeed}
spring.datasource.username=${DB_USER:innovafeed}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pocas conexiones: el plan gratis de Supabase limita las conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# update: crea/ajusta tablas sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update

# --- Servidor ---
server.port=${PORT:8080}
# Render recibe HTTPS y reenvía a la app por HTTP: esto hace que las redirecciones usen https://
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# En producción la consola H2 queda apagada y las plantillas en caché
spring.h2.console.enabled=false
spring.thymeleaf.cache=true

# --- Datos de demostración ---
# La contraseña del admin es OBLIGATORIA en producción (variable ADMIN_PASSWORD):
# la de desarrollo aparece en el README y cualquiera podría usarla.
innovafeed.admin.password=${ADMIN_PASSWORD}
