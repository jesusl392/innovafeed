# ==========================================
# innovaFeed - PRODUCCIÓN (PostgreSQL)
# Activar con: java -jar innovafeed.jar --spring.profiles.active=prod
# Los datos sensibles se leen de variables de entorno, nunca se escriben aquí.
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/innovafeed}
spring.datasource.username=${DB_USER:innovafeed}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# update: crea/ajusta tablas sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update

# En producción la consola H2 queda apagada y las plantillas en caché
spring.h2.console.enabled=false
spring.thymeleaf.cache=true

server.port=${PORT:8080}
